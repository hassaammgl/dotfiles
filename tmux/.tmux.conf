# Kitty / simple terminals
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:clipboard:ccolour:cstyle:focus:title"
set -as terminal-overrides ",xterm-kitty:RGB"

# Prefix: Alt+f (primary) | Ctrl+a (backup)
unbind C-b
set -g prefix M-f
set -g prefix2 C-a
bind M-f send-prefix
bind C-a send-prefix -2

# Basics
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 10
set -g focus-events on
set -g status-position top
set -g set-clipboard on

# Default = kanagawa dragon (nvim overwrites ~/.tmux-theme.conf on start/mood change)
set -g status on
set -g status-interval 5
set -g status-style "bg=#181616,fg=#c5c9c5"
set -g status-left "#[bg=#8ba4b0,fg=#181616,bold] tmux #S #[default] "
set -g status-right "#[fg=#c8c093]%H:%M "
set -g status-left-length 30
set -g window-status-current-style "bg=#8ba4b0,fg=#181616,bold"
set -g window-status-style "bg=#181616,fg=#c8c093"
set -g pane-active-border-style "fg=#8ba4b0"
set -g pane-border-style "fg=#625e5a"
set -g message-style "bg=#8ba4b0,fg=#181616"
set -g mode-style "bg=#8ba4b0,fg=#181616"

if-shell "[ -f ~/.tmux-theme.conf ]" "source-file ~/.tmux-theme.conf"

bind r source-file ~/.tmux.conf \; if-shell "[ -f ~/.tmux-theme.conf ]" "source-file ~/.tmux-theme.conf" \; display-message "tmux reloaded"

# Splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind c new-window -c "#{pane_current_path}"
bind e new-window -c "#{pane_current_path}" "nvim ."
bind s choose-session
bind w choose-window

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
