# wallust v3 — colors from wallpaper
backend = "fastresize"
color_space = "lch"
palette = "dark16"
check_contrast = true

[templates]
waybar = { src = 'colors-waybar.css', dst = '~/.config/waybar/colors.css', pywal = true }
rofi   = { src = 'rofi.rasi',         dst = '~/.config/rofi/config.rasi',  pywal = false }
mako   = { src = 'mako',              dst = '~/.config/mako/config',       pywal = true }
swayosd = { src = 'swayosd.css',      dst = '~/.config/swayosd/colors.css', pywal = true }
