background {
    monitor =
    path = /home/ratx86/Pictures/Wallpapers/current
    blur_passes = 2
    blur_size = 6
    noise = 0.01
    contrast = 0.8
    brightness = 0.5
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    outer_color = rgba(A2757F66)
    inner_color = rgba(131218ee)
    font_color = rgb(FFF8FF)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%I:%M %p')"
    color = rgb(FFF8FF)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B %Y')"
    color = rgb(A2757F)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}
