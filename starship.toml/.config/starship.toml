add_newline = true
command_timeout = 500
format = """
┌─[$time]($style) $directory $git_branch $git_status $python
└─$character"""

[time]
disabled = false
format = "[$time]($style)"
style = "bright-black"
time_format = "%H:%M"

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold green)"
vicmd_symbol = "[❮](bold green)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"

[git_branch]
format = "[$symbol$branch]($style) "
style = "italic purple"
symbol = " "

[git_status]
format     = '[$all_status$ahead_behind]($style)'
style      = "cyan"
conflicted = "🏳"
up_to_date = ""
untracked  = "…"
modified   = "*"
stashed    = "📦"
staged     = "+"
renamed    = "→"
deleted    = "✕"
ahead      = "⇡${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
behind     = "⇣${count}"

[python]
format = "via [$symbol$version( \\($virtualenv\\))]($style) "
style = "bold yellow"
symbol = " "
